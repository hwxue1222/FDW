<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bybridge Job Agency System</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Bybridge Job Agency System</h1>
      </div>
      <nav class="mode-switch" aria-label="系统入口">
        <button class="active" data-view="front">前台</button>
        <button data-view="admin">后台</button>
      </nav>
    </header>

    <main>
      <section id="signaturePortal" class="view">
        <div class="signature-shell">
          <div class="section-head">
            <div>
              <p class="eyebrow">E-Signature Link</p>
              <h2>客户电子签署</h2>
            </div>
          </div>
          <div id="signatureContent"></div>
        </div>
      </section>

      <section id="front" class="view active-view">
        <div class="front-layout">
          <aside class="filter-panel">
            <h2>客户筛选</h2>
            <label>
              国籍
              <select id="nationalityFilter">
                <option value="全部">全部</option>
              </select>
            </label>
            <label>
              工作经验
              <select id="experienceFilter">
                <option value="全部">全部</option>
                <option value="2">2 年以上</option>
                <option value="4">4 年以上</option>
                <option value="6">6 年以上</option>
              </select>
            </label>
            <label>
              擅长
              <select id="skillFilter">
                <option value="全部">全部</option>
              </select>
            </label>
          </aside>

          <section>
            <div class="section-head">
              <div id="categoryTabs" class="category-tabs" role="tablist" aria-label="工人分类"></div>
              <span id="frontCount" class="status-pill"></span>
            </div>
            <div id="maidCards" class="maid-grid"></div>
          </section>
        </div>
      </section>

      <section id="admin" class="view">
        <div class="admin-layout">
          <aside class="sidebar">
            <button class="active" data-admin-tab="dashboard">总览</button>
            <button data-admin-tab="maids">女佣管理</button>
            <button data-admin-tab="clients">客户管理</button>
            <button data-admin-tab="process">雇佣流程</button>
            <button data-admin-tab="documents">电子签名</button>
            <div class="sidebar-downloads">
              <h3>Templates</h3>
              <button type="button" class="download-preview" data-url="assets/blank_biodata_template.pdf" data-title="Biodata">Biodata</button>
              <button type="button" class="download-preview" data-url="assets/blank_quotation_template.pdf" data-title="Quotation">Quotation</button>
              <button type="button" class="download-preview" data-url="assets/work_permit_application_form.fillable.v10.pdf" data-title="Work Permit Application Form">Work Permit Application Form</button>
              <button type="button" class="download-preview" data-url="assets/blank_service_agreement_template.pdf" data-title="Standard Service Agreement">Standard Service Agreement</button>
              <button type="button" class="download-preview" data-url="assets/tax_declaration_form.fillable.v2.pdf" data-title="Tax Declaration Form">Tax Declaration Form</button>
              <button type="button" class="download-preview" data-url="assets/blank_form_a_services_fees_template.pdf" data-title="Form A Service Fees">Form A Service Fees</button>
              <button type="button" class="download-preview" data-url="assets/blank_pdpa_statement_template.pdf" data-title="PDPA Statement">PDPA Statement</button>
              <button type="button" class="download-preview" data-url="assets/blank_insurance_proposal_template.pdf" data-title="Insurance Proposal">Insurance Proposal</button>
              <button type="button" class="download-preview" data-url="assets/blank_employment_contract_template.pdf" data-title="Employment Contract">Employment Contract</button>
              <button type="button" class="download-preview" data-url="assets/blank_job_offer_template.pdf" data-title="Job Offer">Job Offer</button>
              <button type="button" class="download-preview" data-url="assets/blank_safety_agreement_template.pdf" data-title="Safety Agreement">Safety Agreement</button>
              <button type="button" class="download-preview" data-url="assets/blank_rest_day_agreement_template.pdf" data-title="Rest Day Agreement">Rest Day Agreement</button>
            </div>
          </aside>

          <section class="admin-content">
            <div id="dashboard" class="admin-tab active-admin-tab">
              <div class="section-head">
                <div>
                  <p class="eyebrow">Agency Dashboard</p>
                  <h2>后台总览</h2>
                </div>
              </div>
              <div id="metrics" class="metric-grid"></div>
              <div class="two-column">
                <div>
                  <h3>待跟进流程</h3>
                  <div id="pendingTimeline" class="list-stack"></div>
                </div>
                <div>
                  <h3>待签署文件</h3>
                  <div id="pendingDocs" class="list-stack"></div>
                </div>
              </div>
            </div>

            <div id="maids" class="admin-tab">
              <div class="section-head">
                <div>
                  <p class="eyebrow">Maid Records</p>
                  <h2>女佣管理</h2>
                </div>
                <div class="action-row">
                  <label class="upload-btn">
                    上传 Biodata PDF
                    <input id="maidPdfInput" type="file" accept="application/pdf" />
                  </label>
                  <button id="addMaidBtn" class="primary-btn">新增女佣</button>
                </div>
              </div>
              <div id="importStatus" class="import-status"></div>
              <div id="adminMaidList" class="table-list"></div>
            </div>

            <div id="clients" class="admin-tab">
              <div class="section-head">
                <div>
                  <p class="eyebrow">Customer Records</p>
                  <h2>客户管理</h2>
                </div>
                <button id="addClientBtn" class="primary-btn">新增客户</button>
              </div>
              <div id="clientList" class="table-list"></div>
            </div>

            <div id="process" class="admin-tab">
              <div class="section-head">
                <div>
                  <p class="eyebrow">Employment Timeline</p>
                  <h2>雇佣流程</h2>
                </div>
              </div>
              <div class="selector-row">
                <label>
                  选择女佣
                  <select id="timelineMaidSelect"></select>
                </label>
              </div>
              <section class="sign-workbench">
                <div class="sign-controls">
                  <label>
                    客户
                    <select id="processClientSelect"></select>
                  </label>
                </div>
              </section>
              <div id="timelineList" class="timeline"></div>
            </div>

            <div id="documents" class="admin-tab">
              <div class="section-head">
                <div>
                  <p class="eyebrow">E-Signature Center</p>
                  <h2>电子签名文件</h2>
                </div>
                <button id="sendDocBtn" class="primary-btn">发送签署文件</button>
              </div>
              <div id="documentList" class="table-list"></div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <dialog id="recordDialog">
      <form method="dialog" id="recordForm">
        <div class="dialog-head">
          <h2 id="dialogTitle">新增</h2>
          <button value="cancel" class="icon-btn" aria-label="关闭">×</button>
        </div>
        <div id="dialogFields" class="form-grid"></div>
        <menu>
          <button value="cancel" class="secondary-btn">取消</button>
          <button id="dialogSubmit" value="default" class="primary-btn">保存</button>
        </menu>
      </form>
    </dialog>

    <dialog id="previewDialog">
      <div class="preview-shell">
        <div class="dialog-head preview-head">
          <h2 id="previewTitle">预览</h2>
          <button id="previewClose" type="button" class="icon-btn" aria-label="关闭">×</button>
        </div>
        <div class="preview-body">
          <iframe id="previewFrame" title="" loading="lazy"></iframe>
        </div>
        <div class="preview-footer">
          <a id="previewOpen" class="mini-link" href="#" target="_blank" rel="noreferrer">新标签页打开</a>
        </div>
      </div>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
