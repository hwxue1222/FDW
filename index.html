<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bybridge Job Agency System</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Bybridge Job Agency System</h1>
      </div>
      <div class="topbar-actions">
        <nav id="languageSwitch" class="language-switch" aria-label="Language">
          <button class="active" type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">English</button>
        </nav>
        <nav class="mode-switch" aria-label="系统入口">
          <button id="frontModeBtn" class="active" data-view="front">前台</button>
          <button id="adminModeBtn" data-view="admin">后台</button>
        </nav>
      </div>
    </header>

    <main>
      <section id="signaturePortal" class="view">
        <div class="signature-shell">
          <div class="section-head">
            <div>
              <p class="eyebrow">E-Signature Link</p>
              <h2>客户电子签署</h2>
            </div>
          </div>
          <div id="signatureContent"></div>
        </div>
      </section>

      <section id="front" class="view active-view">
        <div class="front-layout">
          <aside class="filter-panel">
            <h2 id="filterTitle">客户筛选</h2>
            <label>
              <span id="nationalityLabel">国籍</span>
              <select id="nationalityFilter">
                <option value="全部">全部</option>
              </select>
            </label>
            <label>
              <span id="experienceLabel">工作经验</span>
              <select id="experienceFilter">
                <option value="全部">全部</option>
                <option value="2">2 年以上</option>
                <option value="4">4 年以上</option>
                <option value="6">6 年以上</option>
              </select>
            </label>
            <label>
              <span id="skillLabel">擅长</span>
              <select id="skillFilter">
                <option value="全部">全部</option>
              </select>
            </label>
          </aside>

          <section>
            <div class="section-head">
              <div id="categoryTabs" class="category-tabs" role="tablist" aria-label="工人分类"></div>
              <span id="frontCount" class="status-pill"></span>
            </div>
            <div id="maidCards" class="maid-grid"></div>
          </section>
        </div>
      </section>

      <section id="admin" class="view">
        <div class="admin-layout">
          <aside class="sidebar">
            <div class="admin-category-switch" id="adminCategoryTabs" aria-label="后台分类"></div>
            <div class="sidebar-section-title">业务模块</div>
            <button class="active" data-admin-tab="maids">人员管理</button>
            <button data-admin-tab="clients">客户管理</button>
            <button data-admin-tab="process">雇佣流程</button>
            <button data-admin-tab="documents">签署文件</button>
            <button data-admin-tab="downloads">表格下载</button>
          </aside>

          <section class="admin-content">
            <div id="maids" class="admin-tab active-admin-tab">
              <div class="section-head">
                <div>
                  <p class="eyebrow" id="personnelEyebrow">Personnel Records</p>
                  <h2 id="personnelTitle">人员管理</h2>
                </div>
                <div class="action-row">
                  <label class="upload-btn">
                    上传 Biodata PDF
                    <input id="maidPdfInput" type="file" accept="application/pdf" />
                  </label>
                  <button id="addMaidBtn" class="primary-btn">新增人员</button>
                </div>
              </div>
              <div id="importStatus" class="import-status"></div>
              <div id="adminMaidList" class="table-list"></div>
            </div>

            <div id="clients" class="admin-tab">
              <div class="section-head">
                <div>
                  <p class="eyebrow">Customer Records</p>
                  <h2 id="clientTitle">客户管理</h2>
                </div>
                <button id="addClientBtn" class="primary-btn">新增客户</button>
              </div>
              <div id="clientList" class="table-list"></div>
            </div>

            <div id="process" class="admin-tab">
              <div class="section-head">
                <div>
                  <p class="eyebrow">Employment Timeline</p>
                  <h2 id="processTitle">雇佣流程</h2>
                </div>
              </div>
              <div class="selector-row">
                <label>
                  选择人员
                  <select id="timelineMaidSelect"></select>
                </label>
              </div>
              <section class="sign-workbench">
                <div class="sign-controls">
                  <label>
                    客户
                    <select id="processClientSelect"></select>
                  </label>
                </div>
              </section>
              <div id="timelineList" class="timeline"></div>
            </div>

            <div id="documents" class="admin-tab">
              <div class="section-head">
                <div>
                  <p class="eyebrow">Signature Files</p>
                  <h2 id="documentTitle">签署文件</h2>
                </div>
                <button id="sendDocBtn" class="primary-btn">发送签署文件</button>
              </div>
              <div id="documentList" class="table-list"></div>
            </div>

            <div id="downloads" class="admin-tab">
              <div class="section-head">
                <div>
                  <p class="eyebrow">Form Templates</p>
                  <h2 id="downloadTitle">表格下载</h2>
                </div>
              </div>
              <div id="downloadList" class="download-grid"></div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <dialog id="recordDialog">
      <form method="dialog" id="recordForm">
        <div class="dialog-head">
          <h2 id="dialogTitle">新增</h2>
          <button value="cancel" class="icon-btn" aria-label="关闭">×</button>
        </div>
        <div id="dialogFields" class="form-grid"></div>
        <menu>
          <button value="cancel" class="secondary-btn">取消</button>
          <button id="dialogSubmit" value="default" class="primary-btn">保存</button>
        </menu>
      </form>
    </dialog>

    <dialog id="previewDialog">
      <div class="preview-shell">
        <div class="dialog-head preview-head">
          <h2 id="previewTitle">预览</h2>
          <button id="previewClose" type="button" class="icon-btn" aria-label="关闭">×</button>
        </div>
        <div class="preview-body">
          <iframe id="previewFrame" title="" loading="lazy"></iframe>
        </div>
        <div class="preview-footer">
          <a id="previewOpen" class="mini-link" href="#" target="_blank" rel="noreferrer">新标签页打开</a>
        </div>
      </div>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
